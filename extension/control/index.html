<!doctype html>
<!--
  dsh 控制页：浏览器侧边栏里的那段对话。

  `#control-root` 是挂载点，它承载了所有后代元素据以计算的高度，
  所以它必须保留样式。

  本页的内容安全策略声明在 `manifest.json` 里，不在这个文件里，
  它只允许三件事：来自本扩展的脚本与对象，
  以及仅限 loopback 的出站连接（`connect-src ws://127.0.0.1:*
  http://127.0.0.1:*`）——面板正是靠它连到桌面端，
  别的都连不上。因此本文件只加载一个 module 和一张样式表，不内联
  任何东西：没有内联 <script>、没有内联 <style>、没有事件处理属性。
  界面图标是用 JS 构建的内联 SVG。
-->
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>dsh 浏览器扩展（全端）</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="control-root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
