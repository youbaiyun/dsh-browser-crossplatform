# 每次 push 和 pull request，都按发布的标准检查一遍。
#
# 构建故意排在测试之前：有两条断言在没有构建产物时会自己跳过——桥接包里的 e2e
# 和扩展里的许可证声明检查——所以先构建才能让它们真正跑起来，而不是报个绿灯。
#
# 这条 e2e 通过 Playwright 的 chromium API 驱动构建出来的扩展。它必须使用
# Playwright 自带的 Chromium：系统的 Chrome/Edge 137+ 会忽略 --load-extension，
# 而跳过是静默的，所以以前把这个 job 指向 /usr/bin/google-chrome，会让 e2e
# 变成一次绿灯空跑。浏览器在下面安装，并导出它的路径。
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          # 与本项目开发时使用的 pnpm 版本保持一致。
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Build the bridge and both extension targets
        run: |
          pnpm --filter dsh-browser-crossplatform run build
          pnpm --filter dsh-browser-extension run build
          pnpm --filter dsh-browser-extension run build:firefox

      - name: Package both store archives
        # 打包器一旦回退就让构建失败（它拒绝含反斜杠的条目，
        # 并按包内 manifest 给每个归档命名）。
        run: pnpm --filter dsh-browser-extension run package

      - name: Install the e2e browser and point the suite at it
        run: |
          pnpm --dir benchmark install-browser
          # 通过 playwright-core 自己的注册表解析，所以这个路径不会
          # 偏离 lockfile 锁定的那个浏览器版本。
          chromium="$(node benchmark/lib/chromium-path.mjs)"
          echo "PLAYWRIGHT_CHROMIUM_PATH=$chromium" >> "$GITHUB_ENV"
          "$chromium" --version

      - name: Typecheck
        # 强制全量，不用增量。`tsc -b` 会在 lib/ 里留一份构建缓存，而一份过期的缓存
        # 已经导致过：某个根本没编译通过的文件却报出类型检查绿灯。
        run: |
          pnpm --filter dsh-browser-crossplatform exec tsc -b --force
          pnpm --filter @dsh-browser/protocol run typecheck
          pnpm --filter dsh-browser-extension run typecheck

      - name: Benchmark tooling unit tests
        # 不用模型、不用浏览器、不用 dsh：这里只检查测试框架本身，
        # 否则它是整个仓库里被跑到最少的代码。
        run: pnpm --dir benchmark test

      - name: Test
        # 串行执行，不并行。`pnpm -r run test` 会同时跑各个工作区包，
        # 这会把桥接包的端到端套件（一个真实的 Chromium）和扩展套件挤在同一批核心上。
        # 有一条扩展测试断言只打开了一个 WebSocket，而在这种争抢下仅仅变慢的
        # 发现重试就会打开第二个。逐个跑包，能让这项检查保持有意义，而不是偶尔变红。
        #
        # DSH_E2E_COLD_START 用来让启动路径的测试加入进来：它会启动一个浏览器，
        # 这种事绝不能背着开发者发生，所以默认关闭。
        env:
          DSH_E2E_COLD_START: '1'
        run: pnpm -r --workspace-concurrency=1 run test
