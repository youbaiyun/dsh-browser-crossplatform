# 这个 dsh profile 的补丁层，在每个 bundle 层之后应用：
# 一个顶层 YAML 数组，存放 loader 补丁条目（按 id 定位的配置覆盖、
# 禁用，以及插入列表；允许 `!!js` 表达式）。
#
# 这份副本是脱敏模板：所有机器相关的绝对路径都已替换成占位符。
# 恢复文件之前先把它们换掉——参见
# README-what-these-are-and-how-to-restore.md，那份文档里也写了
# 占位符约定：
#   <DSH_HOME>       你的 dsh 主目录（默认 ~/.dsh，Windows 上是 %USERPROFILE%\.dsh）
#   <WORKSPACE_DIR>  任何你真的拿来当工作区用的目录
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-account
    model: deepseek-flash
    reasoningEffort: high
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: null
    process: standard
    completion: skipped
    usage: compact
    developerTools: false
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: compact
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: false
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
# 用户级技能目录挂载（默认位置 <DSH_HOME>\skills）。
# base 包 cordis 预设里的 skill-filesystem 行依赖
# createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')，
# 该包在本 profile 的 node_modules 下无法解析，`!!js` 抛错会让整行加载失败，
# 于是技能目录里只剩插件自带的 skill。这里直接挂一个显式根的提供方。
# 注意：插件市场会重写本文件，中文注释可能被它弄成乱码，属于显示问题，不影响加载。
- insert:
    - id: user-skill-filesystem
      name: "@deepseek-ai/dsh-skill-filesystem"
      config:
        providerName: user-skills
        includeDefaultRoots: true
        customSkillDirs:
          - '<DSH_HOME>\skills'
- id: bridge-browser
  disabled: false
