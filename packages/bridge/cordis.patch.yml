# dsh `web` profile 的浏览器 bridge 层。
#
# `dsh plugin --profile desktop add dsh-browser-crossplatform` 会注册本包的
# `dsh.bundle` manifest，所以仓库的启动器和 `npx @deepseek-ai/dsh@0.2.0-rc.2 web`
# 都会套用这份补丁，不需要额外的命令行选项。
#（这里先前写的是 `--profile web`，与文档、README 里那 12 处 `--profile desktop` 不一致；
#  用户照这份注释装进 web profile，页面上就找不到插件。）
#
# 首次启动时，插件会生成一个 bearer token 并把它持久化在
# ~/.dsh/ext-bridge-token（chmod 0600）。本地扩展无需手工输入 token 就能发现
# bridge。要为远程部署钉住一个固定 token，请设置 DSH_EXT_TOKEN 并在下面引用它。
# 由扩展创建的 session 默认落在 ~/.dsh/browser-sessions 工作区。
# 设置 DSH_BROWSER_SESSION_WORKSPACE 可以另选路径，或把它设成空字符串，
# 让那些 session 保持 Ungrouped。
# Session 只在第一条消息时才实体化（deferSessionCreate 默认为 true）：
# 打开侧边面板而不发消息，不会留下任何 session。
#
# 安全：bridge 路径自带 token 认证，并对非 loopback 的远端拒绝特权 gateway
# 方法（settings/credentials/open-*）。不要带着这一层在不可信的网络上
# 运行 `dsh web --host 0.0.0.0`。

- insert:
    - id: bridge-browser
      name: 'dsh-browser-crossplatform'
      config:
        token: !!js process.env.DSH_EXT_TOKEN
        sessionWorkspacePath: !!js process.env.DSH_BROWSER_SESSION_WORKSPACE
        toolTimeoutMs: 90000
        snapshotMaxChars: 32000
        maxInteractiveItems: 60
