# 把由扩展支撑的浏览器工具替换成 benchmark 的 Playwright adapter，同时保持同一个
# DSH web profile、模型和会话 API。

- id: bridge-browser
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js process.env.BENCHMARK_SESSION_ROOT

- id: storage-json
  config:
    root: !!js process.env.BENCHMARK_STORAGE_ROOT

- insert:
    - id: benchmark-playwright-browser
      # runner 会把这个可移植的占位符替换成 benchmark/results/runtime/ 下一份
      # 生效 patch 里的 file:// URL。
      name: __BENCHMARK_PLAYWRIGHT_PLUGIN__
      config:
        startUrl: !!js process.env.BENCHMARK_START_URL
        executablePath: !!js process.env.PLAYWRIGHT_CHROMIUM_PATH
        headless: true
        snapshotMaxChars: 32000
        maxInteractiveItems: 60
